version: 2

models:
  - name: fct_customer_health_score
    description: "Predictive model evaluating account health based on feature adoption and technical stability. Used for churn prevention and identifying expansion opportunities."
    columns:
      - name: account_id
        description: "Primary key. Unique identifier for each account."
        tests:
          - not_null
          - unique

      - name: health_score
        description: "Calculated health metric: (unique_features_used * 10) - (total_errors * 5). High score indicates high engagement and stability."

      - name: prediction_status
        description: "Categorical classification of the account state based on usage and error patterns."
